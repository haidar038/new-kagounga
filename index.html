        s.src = 'https://www.googletagmanager.com/gtag/js?id=G-8JC93J3FD7';
        document.head.appendChild(s);
      };
      var queue = function () {
        (window.requestIdleCallback || function (cb) { setTimeout(cb, 1); })(
          inject,
          { timeout: 3000 }
        );
      };
      var granted = false;
      try { granted = localStorage.getItem(KEY) === 'granted'; } catch (e) {}
      if (granted) {
        if (document.readyState === 'complete') queue();
        else window.addEventListener('load', queue);
      } else {
        window.addEventListener('kga-consent', function (e) {
          if (e.detail === 'granted') queue();
        });
      }
    })();
